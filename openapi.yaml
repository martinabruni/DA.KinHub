openapi: 3.0.3
info:
  title: KinHub API
  version: "1.0"
  description: OpenAPI document for importing KinHub endpoints into Postman.
servers:
  - url: https://kinhub-dev-lauj4ewc-func.azurewebsites.net
    description: Azure dev Function App
  - url: http://localhost:7071
    description: Local Azure Functions runtime
tags:
  - name: Health
  - name: Metadata
  - name: KinHub
  - name: KinList
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness
      operationId: healthLive
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveResponse"
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness
      operationId: healthReady
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
  /api/version:
    get:
      tags:
        - Metadata
      summary: Build metadata
      operationId: getVersion
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
  /api/status:
    get:
      tags:
        - Metadata
      summary: Application status
      operationId: getStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/openapi.json:
    get:
      tags:
        - Metadata
      summary: OpenAPI document
      operationId: getOpenApiJson
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                type: object
  /api/kinhub/bootstrap:
    get:
      tags:
        - KinHub
      summary: Resolve the KinHub post-login state
      operationId: getKinHubBootstrap
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bootstrap resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KinHubBootstrapResult"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/kinhub/family-context:
    get:
      tags:
        - KinHub
      summary: Validate the Family policy for a familyId
      operationId: getKinHubFamilyContext
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          description: Family identifier to validate against the Family policy.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Access granted
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/kinhub/families:
    post:
      tags:
        - KinHub
      summary: Create the first family for the signed-in user
      operationId: createKinHubFamily
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KinHubBootstrapResult"
        "200":
          description: Existing family returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KinHubBootstrapResult"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/families/details:
    get:
      tags:
        - KinHub
      summary: Read the active family name for the authorized family
      operationId: getKinHubFamilyDetails
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Family details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetails"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "409":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/families/members:
    get:
      tags:
        - KinHub
      summary: Read a keyset page of active family members for the authorized family
      operationId: getKinHubFamilyMembers
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Family members page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMembersPage"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "409":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/families/invitations:
    get:
      tags:
        - KinHub
      summary: Read a keyset page of active family invitations for the authorized family
      operationId: getKinHubFamilyInvitations
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Family invitations page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationsPage"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "409":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
    post:
      tags:
        - KinHub
      summary: Create an invitation for the authorized family
      operationId: postKinHubFamilyInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Invitation created
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "409":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/families/invitations/{invitationId:guid}:
    delete:
      tags:
        - KinHub
      summary: Revoke an active family invitation
      operationId: deleteKinHubFamilyInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "404":
          $ref: "#/components/responses/ProblemDetails"
        "409":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/families/join:
    post:
      tags:
        - KinHub
      summary: Join a family using an invitation code
      operationId: postKinHubFamilyJoin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Family joined
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "409":
          $ref: "#/components/responses/ProblemDetails"
        "429":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/services:
    get:
      tags:
        - KinHub
      summary: List the KinServices available for the authorized family
      operationId: getKinHubServiceCatalog
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum:
              - it
              - en
      responses:
        "200":
          description: Family service catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KinHubServiceCatalogResult"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinhub/services/{serviceKey}/access:
    get:
      tags:
        - KinHub
      summary: Check whether the authorized family can access a KinService
      operationId: checkKinHubServiceAccess
      security:
        - bearerAuth: []
      parameters:
        - name: serviceKey
          in: path
          required: true
          schema:
            type: string
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Access granted
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
  /api/kinlist/items:
    get:
      tags:
        - KinList
      summary: Read a keyset page of active KinList items visible to the authorized family
      operationId: getKinListItems
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Active KinList items page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveItemsPage"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "401":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "500":
          $ref: "#/components/responses/ProblemDetails"
        "503":
          $ref: "#/components/responses/ProblemDetails"
components:
  responses:
    ProblemDetails:
      description: Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetails:
      type: object
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        correlationId:
          type: string
    HealthLiveResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: KinHub
    HealthReadyCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          example: healthy
    HealthReadyResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          example: healthy
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthReadyCheck"
    BuildInfo:
      type: object
      required:
        - appName
        - version
        - commitSha
        - buildDate
        - environment
        - apiVersion
      properties:
        appName:
          type: string
          example: KinHub
        version:
          type: string
          example: 1.0.0
        commitSha:
          type: string
          example: 91b8864
        buildDate:
          type: string
          example: 2026-07-22T18:00:00Z
        environment:
          type: string
          example: Development
        apiVersion:
          type: string
          example: "1.0"
    StatusResponse:
      type: object
      required:
        - status
        - appName
        - version
        - environment
        - timestamp
      properties:
        status:
          type: string
          example: operational
        appName:
          type: string
          example: KinHub
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          example: Development
        timestamp:
          type: string
          format: date-time
    KinHubBootstrapResult:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - family
            - onboarding
        familyId:
          type: string
          format: uuid
          nullable: true
    KinHubServiceCatalogItem:
      type: object
      required:
        - key
        - route
        - name
        - description
      properties:
        key:
          type: string
        route:
          type: string
        name:
          type: string
        description:
          type: string
    KinHubServiceCatalogResult:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/KinHubServiceCatalogItem"
    FamilyDetails:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    FamilyMember:
      type: object
      required:
        - displayName
        - initials
        - isCurrentUser
      properties:
        displayName:
          type: string
          nullable: true
        initials:
          type: string
          nullable: true
        isCurrentUser:
          type: boolean
    FamilyMembersPage:
      type: object
      required:
        - items
        - effectivePageSize
        - maxPageSize
        - previousCursor
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyMember"
        effectivePageSize:
          type: integer
          format: int32
        maxPageSize:
          type: integer
          format: int32
        previousCursor:
          type: string
          nullable: true
        nextCursor:
          type: string
          nullable: true
    FamilyInvitationCreator:
      type: object
      required:
        - displayName
        - initials
      properties:
        displayName:
          type: string
          nullable: true
        initials:
          type: string
          nullable: true
    FamilyInvitation:
      type: object
      required:
        - id
        - creator
        - createdAt
        - expiresAt
        - status
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: "#/components/schemas/FamilyInvitationCreator"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - active
    FamilyInvitationsPage:
      type: object
      required:
        - items
        - effectivePageSize
        - maxPageSize
        - previousCursor
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyInvitation"
        effectivePageSize:
          type: integer
          format: int32
        maxPageSize:
          type: integer
          format: int32
        previousCursor:
          type: string
          nullable: true
        nextCursor:
          type: string
          nullable: true
    ActiveItemsPageAuthor:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          nullable: true
    ActiveItemsPageCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ActiveItemsPageItem:
      type: object
      required:
        - id
        - name
        - categories
        - remainingCategoryCount
        - author
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ActiveItemsPageCategory"
        remainingCategoryCount:
          type: integer
          format: int32
        author:
          $ref: "#/components/schemas/ActiveItemsPageAuthor"
        version:
          type: string
    ActiveItemsPage:
      type: object
      required:
        - items
        - effectivePageSize
        - maxPageSize
        - previousCursor
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActiveItemsPageItem"
        effectivePageSize:
          type: integer
          format: int32
        maxPageSize:
          type: integer
          format: int32
        previousCursor:
          type: string
          nullable: true
        nextCursor:
          type: string
          nullable: true
