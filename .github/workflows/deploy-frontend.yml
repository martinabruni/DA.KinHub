name: Build and deploy frontend

on:
  workflow_call:
    inputs:
      function_app_hostname:
        required: false
        type: string
      static_web_app_name:
        required: false
        type: string
      static_web_app_hostname:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Test and validate frontend
        run: |
          npm run --prefix src/frontend test
          npm run --prefix src/frontend lint
          npm run --prefix src/frontend typecheck
          npm run --prefix src/frontend i18n:validate
          npm run --prefix src/frontend routes:validate
          npm run --prefix src/frontend design-system:validate

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve frontend deployment settings
        id: deploy
        shell: bash
        run: |
          resource_group="${{ vars.AZURE_RESOURCE_GROUP }}"
          static_web_app_url="${{ vars.AZURE_STATIC_WEB_APP_URL }}"
          test -n "$resource_group"

          function_app_hostname="${{ inputs.function_app_hostname }}"
          if [[ -z "$function_app_hostname" ]]; then
            function_app_name="${{ vars.AZURE_FUNCTIONAPP_NAME }}"
            if [[ -z "$function_app_name" ]]; then
              function_app_name=$(az functionapp list \
                --resource-group "$resource_group" \
                --query "[0].name" \
                --output tsv)
            fi
            function_app_hostname=$(az functionapp show \
              --name "$function_app_name" \
              --resource-group "$resource_group" \
              --query defaultHostName \
              --output tsv)
          fi

          static_web_app_name="${{ inputs.static_web_app_name || vars.AZURE_STATIC_WEB_APP_NAME }}"
          static_web_app_hostname="${{ inputs.static_web_app_hostname }}"

          if [[ -z "$static_web_app_hostname" && -n "$static_web_app_url" ]]; then
            static_web_app_hostname="${static_web_app_url#https://}"
            static_web_app_hostname="${static_web_app_hostname#http://}"
            static_web_app_hostname="${static_web_app_hostname%%/*}"
          fi

          if [[ -z "$static_web_app_name" && -n "$static_web_app_hostname" ]]; then
            static_web_app_name="$static_web_app_hostname"
          fi

          if [[ -z "$static_web_app_name" ]]; then
            static_web_app_name=$(az resource list \
              --resource-group "$resource_group" \
              --resource-type "Microsoft.Web/staticSites" \
              --query "[0].name" \
              --output tsv)
          fi

          if [[ -z "$static_web_app_hostname" ]]; then
            static_web_app_hostname=$(az resource show \
              --name "$static_web_app_name" \
              --resource-group "$resource_group" \
              --resource-type "Microsoft.Web/staticSites" \
              --query properties.defaultHostname \
              --output tsv)
          fi

          test -n "$function_app_hostname"
          test -n "$static_web_app_name"
          test -n "$static_web_app_hostname"

          echo "function_app_hostname=$function_app_hostname" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$static_web_app_name" >> "$GITHUB_OUTPUT"
          echo "static_web_app_hostname=$static_web_app_hostname" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://${{ steps.deploy.outputs.function_app_hostname }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          VITE_ENTRA_FRONTEND_CLIENT_ID: ${{ secrets.ENTRA_FRONTEND_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_INSTANCE }}
          VITE_ENTRA_REDIRECT_URI: https://${{ steps.deploy.outputs.static_web_app_hostname }}
        run: npm run --prefix src/frontend build

      - name: Deploy Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.CORE_AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend/dist
          skip_app_build: true
          output_location: ""

      - name: Smoke test frontend
        run: curl --fail --retry 8 --retry-delay 10 "https://${{ steps.deploy.outputs.static_web_app_hostname }}"

      - name: Deployment summary
        run: |
          echo "## KinHub frontend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static Web App: ${{ steps.deploy.outputs.static_web_app_name }}" >> "$GITHUB_STEP_SUMMARY"
