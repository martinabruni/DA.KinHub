name: Deploy changed scopes

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/backend/**"
      - "src/frontend/**"
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Scope to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - infrastructure
          - backend
          - frontend

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect deployable paths
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_SCOPE: ${{ inputs.deployment_scope }}
        run: |
          infrastructure=false
          backend=false
          frontend=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual deployments must run from main." >&2
              exit 1
            fi

            case "$MANUAL_SCOPE" in
              all)
                infrastructure=true
                backend=true
                frontend=true
                ;;
              infrastructure|backend|frontend)
                printf -v "$MANUAL_SCOPE" '%s' true
                ;;
            esac
          else
            base_sha="$BEFORE_SHA"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha=$(git hash-object -t tree /dev/null)
            fi

            while IFS= read -r changed_path; do
              case "$changed_path" in
                infra/*) infrastructure=true ;;
                src/backend/*) backend=true ;;
                src/frontend/*) frontend=true ;;
              esac
            done < <(git diff --no-renames --name-only "$base_sha" "$GITHUB_SHA")
          fi

          echo "infrastructure=$infrastructure" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Infrastructure: $infrastructure" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $backend" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $frontend" >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    name: Provision Azure infrastructure
    if: needs.changes.outputs.infrastructure == 'true'
    needs: changes
    uses: ./.github/workflows/deploy-infrastructure.yml
    secrets: inherit

  backend:
    name: Migrate and deploy backend
    if: >-
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    needs: [changes, infrastructure]
    uses: ./.github/workflows/deploy-backend.yml
    with:
      function_app_name: ${{ needs.infrastructure.outputs.function_app_name }}
      function_app_hostname: ${{ needs.infrastructure.outputs.function_app_hostname }}
      function_principal_id: ${{ needs.infrastructure.outputs.function_principal_id }}
      postgres_server_name: ${{ needs.infrastructure.outputs.postgres_server_name }}
      postgres_hostname: ${{ needs.infrastructure.outputs.postgres_hostname }}
      postgres_database_name: ${{ needs.infrastructure.outputs.postgres_database_name }}
    secrets: inherit

  frontend:
    name: Build and deploy frontend
    if: >-
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    needs: [changes, infrastructure]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      function_app_hostname: ${{ needs.infrastructure.outputs.function_app_hostname }}
      static_web_app_name: ${{ needs.infrastructure.outputs.static_web_app_name }}
      static_web_app_hostname: ${{ needs.infrastructure.outputs.static_web_app_hostname }}
    secrets: inherit
