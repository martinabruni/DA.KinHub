name: Deploy Backend (reusable)

# IAC-01: Reusable workflow that encapsulates the shared backend deploy logic
# (compute image tags, validate inputs, resolve current rollout images, deploy
# infrastructure, run the expand/contract migration, roll out revisions).
# Invoked by backend.yml for both the dev and prod environments.

on:
  workflow_call:
    inputs:
      environment:
        description: Target deployment environment (dev or prod).
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      POSTGRES_ADMINISTRATOR_LOGIN:
        required: true
      POSTGRES_ADMINISTRATOR_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write
  packages: write
  actions: read

env:
  BICEP_FILE: ops/iac/main.bicep
  GHCR_SERVER: ghcr.io
  DOTNET_VERSION: 10.0.x

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Functions App package
        uses: actions/download-artifact@v4
        with:
          name: functions-app-package

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compute image tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IDENTITY_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        run: |
          required_values=(
            "${{ vars.AZURE_RESOURCE_GROUP }}"
            "${{ vars.AZURE_LOCATION }}"
            "${{ vars.STATIC_WEB_APP_LOCATION }}"
            "${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            "${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            "${{ vars.VITE_CORE_URL }}"
            "${{ vars.VITE_IDENTITY_URL }}"
            "${{ vars.VITE_KINRECIPE_URL }}"
            "${{ vars.VITE_KINLIST_URL }}"
            "${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            "${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            "${{ vars.FUNCTION_APP_NAME }}"
            "${{ vars.KINLIST_AUDIO_STORAGE_ACCOUNT_NAME }}"
            "${{ vars.APPLICATION_INSIGHTS_NAME }}"
            "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            "${{ vars.KEY_VAULT_NAME }}"
            "${{ vars.POSTGRES_SERVER_NAME }}"
            "${{ vars.POSTGRES_DATABASE_NAME }}"
            "${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            "${{ vars.SPEECH_ACCOUNT_NAME }}"
            "${{ vars.JWT_ISSUER }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            "${{ secrets.JWT_SECRET }}"
            "${{ secrets.GHCR_USERNAME }}"
            "${{ secrets.GHCR_PASSWORD }}"
            "${IDENTITY_IMAGE}"
          )

          for value in "${required_values[@]}"; do
            if [ -z "$value" ]; then
              echo "A required deployment input is empty."
              exit 1
            fi
          done

          for image in "${IDENTITY_IMAGE}"; do
            case "${image}" in
              ghcr.io/*) ;;
              *)
                echo "Image must start with ghcr.io/: ${image}"
                exit 1
                ;;
            esac
          done

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve current backend images
        run: |
          resolve_rollout_image() {
            local app_name="$1"
            local fallback_image="$2"
            local resolved_image

            resolved_image="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${app_name}" \
                --query "properties.template.containers[0].image" \
                --output tsv \
                2>/dev/null || true
            )"

            if [ -z "${resolved_image}" ]; then
              resolved_image="${fallback_image}"
            fi

            printf '%s' "${resolved_image}"
          }

          echo "IDENTITY_ROLLOUT_IMAGE=$(resolve_rollout_image "${{ vars.IDENTITY_CONTAINER_APP_NAME }}" "${IDENTITY_IMAGE}")" >> "$GITHUB_ENV"

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --name managed-identities \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "ops/iac/managed-identities.bicep" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
              functionAppName="${{ vars.FUNCTION_APP_NAME }}"

          deploy_parameters=(
            location="${{ vars.AZURE_LOCATION }}"
            staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}"
            coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            kinListStaticWebAppName="${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            coreFrontendOrigin="${{ vars.VITE_CORE_URL }}"
            identityFrontendOrigin="${{ vars.VITE_IDENTITY_URL }}"
            kinRecipeFrontendOrigin="${{ vars.VITE_KINRECIPE_URL }}"
            kinListFrontendOrigin="${{ vars.VITE_KINLIST_URL }}"
            containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            functionAppName="${{ vars.FUNCTION_APP_NAME }}"
            kinListAudioStorageAccountName="${{ vars.KINLIST_AUDIO_STORAGE_ACCOUNT_NAME }}"
            applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}"
            logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            keyVaultName="${{ vars.KEY_VAULT_NAME }}"
            postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}"
            postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}"
            postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            speechAccountName="${{ vars.SPEECH_ACCOUNT_NAME }}"
            jwtSecret="${{ secrets.JWT_SECRET }}"
            jwtIssuer="${{ vars.JWT_ISSUER }}"
            ghcrUsername="${{ secrets.GHCR_USERNAME }}"
            ghcrPassword="${{ secrets.GHCR_PASSWORD }}"
            identityImage="${IDENTITY_ROLLOUT_IMAGE}"
          )

          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

      - name: Open temporary Postgres firewall rule for migrations
        run: |
          runner_ip="$(curl -s https://api.ipify.org)"

          if [ -z "${runner_ip}" ]; then
            echo "Failed to resolve the runner's public IP."
            exit 1
          fi

          echo "RUNNER_IP=${runner_ip}" >> "$GITHUB_ENV"
          echo "Opening temporary firewall rule for ${runner_ip}."

          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.POSTGRES_SERVER_NAME }}" \
            --rule-name gh-actions-runner-temp \
            --start-ip-address "${runner_ip}" \
            --end-ip-address "${runner_ip}"

      - name: Run database migrations
        env:
          ConnectionStrings__KinHub: Server=${{ vars.POSTGRES_SERVER_NAME }}.postgres.database.azure.com;Database=${{ vars.POSTGRES_DATABASE_NAME }};Port=5432;User Id=${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }};Password=${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }};Ssl Mode=Require;
        run: |
          dotnet run --project src/Presentations/Kin.KinHub.Migrations.Runner --configuration Release --

      - name: Close temporary Postgres firewall rule
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.POSTGRES_SERVER_NAME }}" \
            --rule-name gh-actions-runner-temp \
            --yes

      - name: Roll out backend revisions after migration success
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
            --image "${IDENTITY_IMAGE}"

          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.FUNCTION_APP_NAME }}" \
            --src functions-app.zip
