name: Migrate and deploy backend

on:
  workflow_call:
    inputs:
      function_app_name:
        required: false
        type: string
      function_app_hostname:
        required: false
        type: string
      function_principal_id:
        required: false
        type: string
      postgres_server_name:
        required: false
        type: string
      postgres_hostname:
        required: false
        type: string
      postgres_database_name:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  BUILD_ENVIRONMENT: Development
  POSTGRES_RUNTIME_USERNAME: kinhub_app
  POSTGRES_MIGRATION_USERNAME: kinhub_migrator

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore and build backend
        run: |
          dotnet restore KinHub.slnx
          dotnet build KinHub.slnx --configuration Release --no-restore -p:CommitSha="${GITHUB_SHA::12}" -p:BuildDate="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -p:BuildEnvironment=CI

      - name: Test backend
        run: dotnet test KinHub.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Build migration bundle
        run: |
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations bundle --project src/backend/infrastructure/DA.KinHub.Infrastructure --configuration Release --force --output artifacts/migrations/kinhub-migrations

      - name: Package backend
        id: package
        shell: bash
        run: |
          bash scripts/package-backend.sh "$BUILD_ENVIRONMENT"
          package=$(find artifacts/backend -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve backend deployment settings
        id: deploy
        shell: bash
        run: |
          function_app_name="${{ inputs.function_app_name || vars.AZURE_FUNCTIONAPP_NAME }}"
          if [[ -z "$function_app_name" ]]; then
            function_app_name=$(az functionapp list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[0].name" \
              --output tsv)
          fi

          function_app_hostname="${{ inputs.function_app_hostname }}"
          if [[ -z "$function_app_hostname" ]]; then
            function_app_hostname=$(az functionapp show \
              --name "$function_app_name" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query defaultHostName \
              --output tsv)
          fi

          function_principal_id="${{ inputs.function_principal_id }}"
          if [[ -z "$function_principal_id" ]]; then
            function_principal_id=$(az functionapp identity show \
              --name "$function_app_name" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query principalId \
              --output tsv)
          fi

          postgres_hostname="${{ inputs.postgres_hostname }}"
          if [[ -z "$postgres_hostname" ]]; then
            postgres_hostname=$(az functionapp config appsettings list \
              --name "$function_app_name" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='Database__Host'].value | [0]" \
              --output tsv)
          fi

          postgres_database_name="${{ inputs.postgres_database_name }}"
          if [[ -z "$postgres_database_name" ]]; then
            postgres_database_name=$(az functionapp config appsettings list \
              --name "$function_app_name" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='Database__DatabaseName'].value | [0]" \
              --output tsv)
          fi

          postgres_server_name="${{ inputs.postgres_server_name }}"
          if [[ -z "$postgres_server_name" ]]; then
            postgres_server_name="${postgres_hostname%%.*}"
          fi

          test -n "$function_app_name"
          test -n "$function_app_hostname"
          test -n "$function_principal_id"
          test -n "$postgres_server_name"
          test -n "$postgres_hostname"
          test -n "$postgres_database_name"

          echo "function_app_name=$function_app_name" >> "$GITHUB_OUTPUT"
          echo "function_app_hostname=$function_app_hostname" >> "$GITHUB_OUTPUT"
          echo "function_principal_id=$function_principal_id" >> "$GITHUB_OUTPUT"
          echo "postgres_server_name=$postgres_server_name" >> "$GITHUB_OUTPUT"
          echo "postgres_hostname=$postgres_hostname" >> "$GITHUB_OUTPUT"
          echo "postgres_database_name=$postgres_database_name" >> "$GITHUB_OUTPUT"

      - name: Resolve PostgreSQL Entra administrator
        id: postgres_admin
        shell: bash
        run: |
          principal_name=$(az account show --query user.name --output tsv)
          access_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          principal_object_id=$(node -e "const token=process.argv[1].split('.')[1]; const normalized=token.replace(/-/g,'+').replace(/_/g,'/'); const padded=normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, '='); const payload=JSON.parse(Buffer.from(padded, 'base64').toString('utf8')); process.stdout.write(payload.oid ?? '');" "$access_token")

          test -n "$principal_name"
          test -n "$principal_object_id"

          echo "name=$principal_name" >> "$GITHUB_OUTPUT"
          echo "object_id=$principal_object_id" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Open temporary PostgreSQL firewall rule
        id: postgres_firewall
        shell: bash
        run: |
          subscription_id=$(az account show --query id --output tsv)
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)
          rule_name="gha-${GITHUB_RUN_ID}"
          rule_url="https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ steps.deploy.outputs.postgres_server_name }}/firewallRules/${rule_name}?api-version=2024-08-01"
          az rest \
            --method put \
            --url "$rule_url" \
            --body "{\"properties\":{\"startIpAddress\":\"${runner_ip}\",\"endIpAddress\":\"${runner_ip}\"}}" \
            --only-show-errors \
            --output none
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Provision database principals
        shell: bash
        env:
          POSTGRES_ADMIN_USERNAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.deploy.outputs.postgres_hostname }}" \
            --dbname postgres \
            --username "$POSTGRES_ADMIN_USERNAME" \
            --set ON_ERROR_STOP=1 <<SQL
          DO \$kinhub\$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_RUNTIME_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_RUNTIME_USERNAME }}', '${{ steps.deploy.outputs.function_principal_id }}', 'service', false, false);
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_MIGRATION_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_MIGRATION_USERNAME }}', '$POSTGRES_ADMIN_OBJECT_ID', 'service', true, false);
            END IF;
          END
          \$kinhub\$;
          SQL

      - name: Apply database migrations
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          artifacts/migrations/kinhub-migrations --connection "Host=${{ steps.deploy.outputs.postgres_hostname }};Port=5432;Database=${{ steps.deploy.outputs.postgres_database_name }};Username=${{ env.POSTGRES_MIGRATION_USERNAME }};Password=${token};SSL Mode=Require;Trust Server Certificate=false"

      - name: Grant runtime database privileges
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.deploy.outputs.postgres_hostname }}" \
            --dbname "${{ steps.deploy.outputs.postgres_database_name }}" \
            --username "${{ env.POSTGRES_MIGRATION_USERNAME }}" \
            --set ON_ERROR_STOP=1 <<SQL
          GRANT CONNECT ON DATABASE "${{ steps.deploy.outputs.postgres_database_name }}" TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE ON SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE ON SCHEMA kinlist TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA kinlist TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA kinlist TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA kinlist
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA kinlist
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          SQL

      - name: Close temporary PostgreSQL firewall rule
        if: always() && steps.postgres_firewall.outputs.rule_name != ''
        shell: bash
        run: |
          subscription_id=$(az account show --query id --output tsv)
          rule_url="https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ steps.deploy.outputs.postgres_server_name }}/firewallRules/${{ steps.postgres_firewall.outputs.rule_name }}?api-version=2024-08-01"
          az rest \
            --method delete \
            --url "$rule_url" \
            --only-show-errors \
            --output none

      - name: Deploy Function App with One Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.deploy.outputs.function_app_name }}
          package: ${{ steps.package.outputs.path }}
          sku: flexconsumption
          remote-build: false

      - name: Smoke test API
        run: |
          curl --fail --retry 8 --retry-delay 10 "https://${{ steps.deploy.outputs.function_app_hostname }}/health/live"
          curl --fail --retry 8 --retry-delay 10 "https://${{ steps.deploy.outputs.function_app_hostname }}/api/version"

      - uses: actions/upload-artifact@v7
        with:
          name: kinhub-backend-${{ github.sha }}
          path: |
            artifacts/backend/*.zip
            artifacts/backend/*.sha256
            artifacts/backend/build-manifest.json

      - name: Deployment summary
        run: |
          echo "## KinHub backend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function App: ${{ steps.deploy.outputs.function_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migrations: applied before One Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $(basename '${{ steps.package.outputs.path }}')" >> "$GITHUB_STEP_SUMMARY"
