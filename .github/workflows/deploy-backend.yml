name: Deploy Backend (reusable)

# IAC-01: Reusable workflow that encapsulates the shared backend deploy logic
# (compute image tags, validate inputs, resolve current rollout images, deploy
# infrastructure, run the expand/contract migration, roll out revisions).
# Invoked by backend.yml for both the dev and prod environments.

on:
  workflow_call:
    inputs:
      environment:
        description: Target deployment environment (dev or prod).
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      POSTGRES_ADMINISTRATOR_LOGIN:
        required: true
      POSTGRES_ADMINISTRATOR_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  BICEP_FILE: ops/iac/main.bicep
  GHCR_SERVER: ghcr.io

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IDENTITY_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINRECIPE_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinrecipe-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINLIST_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINLIST_AUDIO_WORKER_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-audio-worker:${GITHUB_SHA}" >> "$GITHUB_ENV"
          migration_image="${{ vars.KINLIST_MIGRATION_IMAGE }}"
          if [ -z "${migration_image}" ]; then
            migration_image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-migration:${GITHUB_SHA}"
          fi
          echo "KINLIST_MIGRATION_IMAGE=${migration_image}" >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        run: |
          required_values=(
            "${{ vars.AZURE_RESOURCE_GROUP }}"
            "${{ vars.AZURE_LOCATION }}"
            "${{ vars.STATIC_WEB_APP_LOCATION }}"
            "${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            "${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            "${{ vars.VITE_CORE_URL }}"
            "${{ vars.VITE_IDENTITY_URL }}"
            "${{ vars.VITE_KINRECIPE_URL }}"
            "${{ vars.VITE_KINLIST_URL }}"
            "${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            "${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            "${{ vars.KINRECIPE_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_AUDIO_WORKER_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
            "${{ vars.APPLICATION_INSIGHTS_NAME }}"
            "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            "${{ vars.KEY_VAULT_NAME }}"
            "${{ vars.POSTGRES_SERVER_NAME }}"
            "${{ vars.POSTGRES_DATABASE_NAME }}"
            "${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            "${{ vars.SPEECH_ACCOUNT_NAME }}"
            "${{ vars.JWT_ISSUER }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            "${{ secrets.JWT_SECRET }}"
            "${{ secrets.GHCR_USERNAME }}"
            "${{ secrets.GHCR_PASSWORD }}"
            "${IDENTITY_IMAGE}"
            "${KINRECIPE_IMAGE}"
            "${KINLIST_IMAGE}"
            "${KINLIST_AUDIO_WORKER_IMAGE}"
            "${KINLIST_MIGRATION_IMAGE}"
          )

          for value in "${required_values[@]}"; do
            if [ -z "$value" ]; then
              echo "A required deployment input is empty."
              exit 1
            fi
          done

          for image in "${IDENTITY_IMAGE}" "${KINRECIPE_IMAGE}" "${KINLIST_IMAGE}" "${KINLIST_AUDIO_WORKER_IMAGE}" "${KINLIST_MIGRATION_IMAGE}"; do
            case "${image}" in
              ghcr.io/*) ;;
              *)
                echo "Image must start with ghcr.io/: ${image}"
                exit 1
                ;;
            esac
          done

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve current backend images
        run: |
          resolve_rollout_image() {
            local app_name="$1"
            local fallback_image="$2"
            local resolved_image

            resolved_image="$(
              az containerapp show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${app_name}" \
                --query "properties.template.containers[0].image" \
                --output tsv \
                2>/dev/null || true
            )"

            if [ -z "${resolved_image}" ]; then
              resolved_image="${fallback_image}"
            fi

            printf '%s' "${resolved_image}"
          }

          echo "IDENTITY_ROLLOUT_IMAGE=$(resolve_rollout_image "${{ vars.IDENTITY_CONTAINER_APP_NAME }}" "${IDENTITY_IMAGE}")" >> "$GITHUB_ENV"
          echo "KINRECIPE_ROLLOUT_IMAGE=$(resolve_rollout_image "${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" "${KINRECIPE_IMAGE}")" >> "$GITHUB_ENV"
          echo "KINLIST_ROLLOUT_IMAGE=$(resolve_rollout_image "${{ vars.KINLIST_CONTAINER_APP_NAME }}" "${KINLIST_IMAGE}")" >> "$GITHUB_ENV"
          echo "KINLIST_AUDIO_WORKER_ROLLOUT_IMAGE=$(resolve_rollout_image "${{ vars.KINLIST_AUDIO_WORKER_CONTAINER_APP_NAME }}" "${KINLIST_AUDIO_WORKER_IMAGE}")" >> "$GITHUB_ENV"

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --name managed-identities \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "ops/iac/managed-identities.bicep" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
              kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" \
              kinListContainerAppName="${{ vars.KINLIST_CONTAINER_APP_NAME }}" \
              kinListAudioWorkerContainerAppName="${{ vars.KINLIST_AUDIO_WORKER_CONTAINER_APP_NAME }}" \
              kinListMigrationJobName="${{ vars.KINLIST_MIGRATION_JOB_NAME }}"

          deploy_parameters=(
            location="${{ vars.AZURE_LOCATION }}"
            staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}"
            coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            kinListStaticWebAppName="${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            coreFrontendOrigin="${{ vars.VITE_CORE_URL }}"
            identityFrontendOrigin="${{ vars.VITE_IDENTITY_URL }}"
            kinRecipeFrontendOrigin="${{ vars.VITE_KINRECIPE_URL }}"
            kinListFrontendOrigin="${{ vars.VITE_KINLIST_URL }}"
            containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}"
            kinListContainerAppName="${{ vars.KINLIST_CONTAINER_APP_NAME }}"
            kinListAudioWorkerContainerAppName="${{ vars.KINLIST_AUDIO_WORKER_CONTAINER_APP_NAME }}"
            kinListMigrationJobName="${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
            applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}"
            logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            keyVaultName="${{ vars.KEY_VAULT_NAME }}"
            postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}"
            postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}"
            postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            speechAccountName="${{ vars.SPEECH_ACCOUNT_NAME }}"
            jwtSecret="${{ secrets.JWT_SECRET }}"
            jwtIssuer="${{ vars.JWT_ISSUER }}"
            ghcrUsername="${{ secrets.GHCR_USERNAME }}"
            ghcrPassword="${{ secrets.GHCR_PASSWORD }}"
            identityImage="${IDENTITY_ROLLOUT_IMAGE}"
            kinRecipeImage="${KINRECIPE_ROLLOUT_IMAGE}"
            kinListImage="${KINLIST_ROLLOUT_IMAGE}"
            kinListAudioWorkerImage="${KINLIST_AUDIO_WORKER_ROLLOUT_IMAGE}"
            kinListMigrationImage="${KINLIST_MIGRATION_IMAGE}"
          )

          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

      - name: Run KinList expand/contract migration
        run: |
          execution_name="$(
            az containerapp job start \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.KINLIST_MIGRATION_JOB_NAME }}" \
              --query name \
              --output tsv
          )"

          if [ -z "${execution_name}" ]; then
            echo "Failed to resolve the migration job execution name."
            exit 1
          fi

          echo "Started migration execution: ${execution_name}"

          for attempt in $(seq 1 90); do
            status="$(
              az containerapp job execution show \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.KINLIST_MIGRATION_JOB_NAME }}" \
                --job-execution-name "${execution_name}" \
                --query "properties.status" \
                --output tsv
            )"

            echo "Migration execution status: ${status}"

            case "${status}" in
              Succeeded)
                exit 0
                ;;
              Failed|Canceled|Cancelled)
                echo "Migration execution ended with status ${status}."
                az containerapp job execution show \
                  --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --name "${{ vars.KINLIST_MIGRATION_JOB_NAME }}" \
                  --job-execution-name "${execution_name}" \
                  --output json
                az extension add --name log-analytics --upgrade --only-show-errors
                workspace_id="$(
                  az monitor log-analytics workspace show \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --workspace-name "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
                    --query customerId \
                    --output tsv
                )"
                if [ -n "${workspace_id}" ]; then
                  analytics_query="let executionName = \"${execution_name}\"; let jobName = \"${{ vars.KINLIST_MIGRATION_JOB_NAME }}\"; let containerName = \"kinlist-migration\"; union isfuzzy=true (ContainerAppConsoleLogs_CL | where TimeGenerated > ago(1h) | extend Message = tostring(column_ifexists(\"Log_s\", \"\")) | extend App = tostring(column_ifexists(\"ContainerAppName_s\", \"\")) | extend Revision = tostring(column_ifexists(\"RevisionName_s\", \"\")) | extend Replica = tostring(column_ifexists(\"ReplicaName_s\", \"\")) | where App contains jobName or Revision contains jobName or Replica contains executionName or Message contains executionName or Message contains \"[migrations]\" | project TimeGenerated, Source = \"console\", App, Revision, Replica, Message), (ContainerAppSystemLogs_CL | where TimeGenerated > ago(1h) | extend Message = tostring(column_ifexists(\"Log_s\", \"\")) | extend App = tostring(column_ifexists(\"ContainerAppName_s\", \"\")) | extend Revision = tostring(column_ifexists(\"RevisionName_s\", \"\")) | extend Replica = tostring(column_ifexists(\"ReplicaName_s\", \"\")) | where App contains jobName or Revision contains jobName or Replica contains executionName or Message contains executionName or Message contains containerName | project TimeGenerated, Source = \"system\", App, Revision, Replica, Message), (AppTraces | where TimeGenerated > ago(1h) | extend Message = tostring(column_ifexists(\"Message\", \"\")) | extend App = tostring(column_ifexists(\"AppRoleName\", \"\")) | where Message contains \"[migrations]\" or Message contains executionName or App contains jobName | project TimeGenerated, Source = \"trace\", App, Revision = \"\", Replica = \"\", Message), (AppExceptions | where TimeGenerated > ago(1h) | extend Message = strcat(tostring(column_ifexists(\"Type\", \"\")), \": \", tostring(column_ifexists(\"OuterMessage\", \"\")), \" \", tostring(column_ifexists(\"Message\", \"\"))) | extend App = tostring(column_ifexists(\"AppRoleName\", \"\")) | where Message contains \"[migrations]\" or Message contains executionName or App contains jobName | project TimeGenerated, Source = \"exception\", App, Revision = \"\", Replica = \"\", Message) | sort by TimeGenerated asc"
                  az monitor log-analytics query \
                    --workspace "${workspace_id}" \
                    --analytics-query "${analytics_query}" \
                    --timespan PT1H \
                    --output table || true
                fi
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out while waiting for migration execution ${execution_name}."
          exit 1

      - name: Roll out backend revisions after migration success
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
            --image "${IDENTITY_IMAGE}"

          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" \
            --image "${KINRECIPE_IMAGE}"

          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.KINLIST_CONTAINER_APP_NAME }}" \
            --image "${KINLIST_IMAGE}"

          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.KINLIST_AUDIO_WORKER_CONTAINER_APP_NAME }}" \
            --image "${KINLIST_AUDIO_WORKER_IMAGE}"
