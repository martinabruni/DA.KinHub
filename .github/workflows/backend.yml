name: Backend CI CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SOLUTION: Kin.KinHub.Core.slnx
  BICEP_FILE: ops/iac/main.bicep
  GHCR_SERVER: ghcr.io
  IDENTITY_API_PROJECT: src/Presentations/Kin.KinHub.Identity.Api/Kin.KinHub.Identity.Api.csproj
  KINRECIPE_API_PROJECT: src/Presentations/Kin.KinHub.KinRecipe.Api/Kin.KinHub.KinRecipe.Api.csproj
  KINLIST_API_PROJECT: src/Presentations/Kin.KinHub.KinList.Api/Kin.KinHub.KinList.Api.csproj
  IDENTITY_DOCKERFILE: src/Presentations/Kin.KinHub.Identity.Api/Dockerfile
  KINRECIPE_DOCKERFILE: src/Presentations/Kin.KinHub.KinRecipe.Api/Dockerfile
  KINLIST_DOCKERFILE: src/Presentations/Kin.KinHub.KinList.Api/Dockerfile

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    name: Backend Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard against Model Context Protocol references
        run: bash scripts/verify-no-mcp.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET solution
        run: dotnet restore ${{ env.DOTNET_SOLUTION }}

      - name: Build .NET solution
        run: dotnet build ${{ env.DOTNET_SOLUTION }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.DOTNET_SOLUTION }} --configuration Release --no-build

  validate_bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file ${{ env.BICEP_FILE }}

  package_identity_image:
    name: Package Identity Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: identity_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push Identity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.IDENTITY_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.identity_image.outputs.image }}

  package_kinrecipe_image:
    name: Package KinRecipe Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: kinrecipe_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinrecipe-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push KinRecipe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.KINRECIPE_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.kinrecipe_image.outputs.image }}

  package_kinlist_image:
    name: Package KinList Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: kinlist_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push KinList image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.KINLIST_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.kinlist_image.outputs.image }}

  deploy_dev:
    name: Deploy Dev
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - validate_bicep
      - package_identity_image
      - package_kinrecipe_image
      - package_kinlist_image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IDENTITY_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINRECIPE_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinrecipe-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINLIST_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          migration_image="${{ vars.KINLIST_MIGRATION_IMAGE }}"
          if [ -z "${migration_image}" ]; then
            migration_image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-migration:${GITHUB_SHA}"
          fi
          echo "KINLIST_MIGRATION_IMAGE=${migration_image}" >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        run: |
          required_values=(
            "${{ vars.AZURE_RESOURCE_GROUP }}"
            "${{ vars.AZURE_LOCATION }}"
            "${{ vars.STATIC_WEB_APP_LOCATION }}"
            "${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            "${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            "${{ vars.VITE_CORE_URL }}"
            "${{ vars.VITE_IDENTITY_URL }}"
            "${{ vars.VITE_KINRECIPE_URL }}"
            "${{ vars.VITE_KINLIST_URL }}"
            "${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            "${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            "${{ vars.KINRECIPE_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
            "${{ vars.APPLICATION_INSIGHTS_NAME }}"
            "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            "${{ vars.KEY_VAULT_NAME }}"
            "${{ vars.POSTGRES_SERVER_NAME }}"
            "${{ vars.POSTGRES_DATABASE_NAME }}"
            "${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            "${{ vars.SPEECH_ACCOUNT_NAME }}"
            "${{ vars.JWT_ISSUER }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            "${{ secrets.JWT_SECRET }}"
            "${{ secrets.GHCR_USERNAME }}"
            "${{ secrets.GHCR_PASSWORD }}"
            "${IDENTITY_IMAGE}"
            "${KINRECIPE_IMAGE}"
            "${KINLIST_IMAGE}"
            "${KINLIST_MIGRATION_IMAGE}"
          )

          for value in "${required_values[@]}"; do
            if [ -z "$value" ]; then
              echo "A required deployment input is empty."
              exit 1
            fi
          done

          for image in "${IDENTITY_IMAGE}" "${KINRECIPE_IMAGE}" "${KINLIST_IMAGE}" "${KINLIST_MIGRATION_IMAGE}"; do
            case "${image}" in
              ghcr.io/*) ;;
              *)
                echo "Image must start with ghcr.io/: ${image}"
                exit 1
                ;;
            esac
          done

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --name managed-identities \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "ops/iac/managed-identities.bicep" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              kinListContainerAppName="${{ vars.KINLIST_CONTAINER_APP_NAME }}" \
              kinListMigrationJobName="${{ vars.KINLIST_MIGRATION_JOB_NAME }}"

          deploy_parameters=(
            location="${{ vars.AZURE_LOCATION }}"
            staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}"
            coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            kinListStaticWebAppName="${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            coreFrontendOrigin="${{ vars.VITE_CORE_URL }}"
            identityFrontendOrigin="${{ vars.VITE_IDENTITY_URL }}"
            kinRecipeFrontendOrigin="${{ vars.VITE_KINRECIPE_URL }}"
            kinListFrontendOrigin="${{ vars.VITE_KINLIST_URL }}"
            containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}"
            kinListContainerAppName="${{ vars.KINLIST_CONTAINER_APP_NAME }}"
            kinListMigrationJobName="${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
            applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}"
            logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            keyVaultName="${{ vars.KEY_VAULT_NAME }}"
            postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}"
            postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}"
            postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            speechAccountName="${{ vars.SPEECH_ACCOUNT_NAME }}"
            jwtSecret="${{ secrets.JWT_SECRET }}"
            jwtIssuer="${{ vars.JWT_ISSUER }}"
            ghcrUsername="${{ secrets.GHCR_USERNAME }}"
            ghcrPassword="${{ secrets.GHCR_PASSWORD }}"
            identityImage="${IDENTITY_IMAGE}"
            kinRecipeImage="${KINRECIPE_IMAGE}"
            kinListImage="${KINLIST_IMAGE}"
            kinListMigrationImage="${KINLIST_MIGRATION_IMAGE}"
          )

          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

      - name: Run KinList expand/contract migration
        run: |
          az containerapp job start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.KINLIST_MIGRATION_JOB_NAME }}"

  deploy_prod:
    name: Deploy Prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - deploy_dev
      - package_identity_image
      - package_kinrecipe_image
      - package_kinlist_image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IDENTITY_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINRECIPE_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinrecipe-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KINLIST_IMAGE=${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          migration_image="${{ vars.KINLIST_MIGRATION_IMAGE }}"
          if [ -z "${migration_image}" ]; then
            migration_image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-migration:${GITHUB_SHA}"
          fi
          echo "KINLIST_MIGRATION_IMAGE=${migration_image}" >> "$GITHUB_ENV"

      - name: Validate deployment inputs
        run: |
          required_values=(
            "${{ vars.AZURE_RESOURCE_GROUP }}"
            "${{ vars.AZURE_LOCATION }}"
            "${{ vars.STATIC_WEB_APP_LOCATION }}"
            "${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            "${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            "${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            "${{ vars.VITE_CORE_URL }}"
            "${{ vars.VITE_IDENTITY_URL }}"
            "${{ vars.VITE_KINRECIPE_URL }}"
            "${{ vars.VITE_KINLIST_URL }}"
            "${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            "${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            "${{ vars.KINRECIPE_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_CONTAINER_APP_NAME }}"
            "${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
            "${{ vars.APPLICATION_INSIGHTS_NAME }}"
            "${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            "${{ vars.KEY_VAULT_NAME }}"
            "${{ vars.POSTGRES_SERVER_NAME }}"
            "${{ vars.POSTGRES_DATABASE_NAME }}"
            "${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            "${{ vars.SPEECH_ACCOUNT_NAME }}"
            "${{ vars.JWT_ISSUER }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            "${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            "${{ secrets.JWT_SECRET }}"
            "${{ secrets.GHCR_USERNAME }}"
            "${{ secrets.GHCR_PASSWORD }}"
            "${IDENTITY_IMAGE}"
            "${KINRECIPE_IMAGE}"
            "${KINLIST_IMAGE}"
            "${KINLIST_MIGRATION_IMAGE}"
          )

          for value in "${required_values[@]}"; do
            if [ -z "$value" ]; then
              echo "A required deployment input is empty."
              exit 1
            fi
          done

          for image in "${IDENTITY_IMAGE}" "${KINRECIPE_IMAGE}" "${KINLIST_IMAGE}" "${KINLIST_MIGRATION_IMAGE}"; do
            case "${image}" in
              ghcr.io/*) ;;
              *)
                echo "Image must start with ghcr.io/: ${image}"
                exit 1
                ;;
            esac
          done

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --name managed-identities \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "ops/iac/managed-identities.bicep" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              kinListContainerAppName="${{ vars.KINLIST_CONTAINER_APP_NAME }}" \
              kinListMigrationJobName="${{ vars.KINLIST_MIGRATION_JOB_NAME }}"

          deploy_parameters=(
            location="${{ vars.AZURE_LOCATION }}"
            staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}"
            coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}"
            identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}"
            kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}"
            kinListStaticWebAppName="${{ vars.KINLIST_STATIC_WEB_APP_NAME }}"
            coreFrontendOrigin="${{ vars.VITE_CORE_URL }}"
            identityFrontendOrigin="${{ vars.VITE_IDENTITY_URL }}"
            kinRecipeFrontendOrigin="${{ vars.VITE_KINRECIPE_URL }}"
            kinListFrontendOrigin="${{ vars.VITE_KINLIST_URL }}"
            containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}"
            identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}"
            kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}"
            kinListContainerAppName="${{ vars.KINLIST_CONTAINER_APP_NAME }}"
            kinListMigrationJobName="${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
            applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}"
            logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}"
            keyVaultName="${{ vars.KEY_VAULT_NAME }}"
            postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}"
            postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}"
            postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}"
            postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
            openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}"
            speechAccountName="${{ vars.SPEECH_ACCOUNT_NAME }}"
            jwtSecret="${{ secrets.JWT_SECRET }}"
            jwtIssuer="${{ vars.JWT_ISSUER }}"
            ghcrUsername="${{ secrets.GHCR_USERNAME }}"
            ghcrPassword="${{ secrets.GHCR_PASSWORD }}"
            identityImage="${IDENTITY_IMAGE}"
            kinRecipeImage="${KINRECIPE_IMAGE}"
            kinListImage="${KINLIST_IMAGE}"
            kinListMigrationImage="${KINLIST_MIGRATION_IMAGE}"
          )

          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters "${deploy_parameters[@]}"

      - name: Run KinList expand/contract migration
        run: |
          az containerapp job start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.KINLIST_MIGRATION_JOB_NAME }}"
