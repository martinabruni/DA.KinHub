name: Backend CI CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  actions: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SOLUTION: Kin.KinHub.Core.slnx
  BICEP_FILE: ops/iac/main.bicep
  GHCR_SERVER: ghcr.io
  IDENTITY_API_PROJECT: src/Presentations/Kin.KinHub.Identity.Api/Kin.KinHub.Identity.Api.csproj
  IDENTITY_DOCKERFILE: src/Presentations/Kin.KinHub.Identity.Api/Dockerfile
  FUNCTIONS_APP_PROJECT: src/Presentations/Kin.KinHub.App.Functions/Kin.KinHub.App.Functions.csproj

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    name: Backend Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard against Model Context Protocol references
        run: bash scripts/verify-no-mcp.sh

      - name: Guard migration and IaC rollout contract
        run: bash scripts/verify-migration-iac.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET solution
        run: dotnet restore ${{ env.DOTNET_SOLUTION }}

      - name: Build .NET solution
        run: dotnet build ${{ env.DOTNET_SOLUTION }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.DOTNET_SOLUTION }} --configuration Release --no-build

  validate_bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file ${{ env.BICEP_FILE }}

  package_identity_image:
    name: Package Identity Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: identity_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push Identity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.IDENTITY_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.identity_image.outputs.image }}

  package_functions_app:
    name: Package Functions App
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Functions App
        run: dotnet publish ${{ env.FUNCTIONS_APP_PROJECT }} -c Release -o publish_output

      - name: Zip Functions App package
        run: |
          cd publish_output
          zip -r ../functions-app.zip .
          cd ..

      - name: Upload Functions App package
        uses: actions/upload-artifact@v4
        with:
          name: functions-app-package
          path: functions-app.zip

  deploy_dev:
    name: Deploy Dev
    if: github.event_name != 'pull_request'
    needs:
      - validate_bicep
      - package_identity_image
      - package_functions_app
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: dev
    secrets: inherit

  deploy_prod:
    name: Deploy Prod
    if: github.event_name != 'pull_request'
    needs:
      - deploy_dev
      - package_identity_image
      - package_functions_app
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: prod
    secrets: inherit
