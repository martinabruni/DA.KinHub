name: Backend CI CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SOLUTION: Kin.KinHub.Core.slnx
  BICEP_FILE: ops/iac/main.bicep
  GHCR_SERVER: ghcr.io
  IDENTITY_API_PROJECT: src/Presentations/Kin.KinHub.Identity.Api/Kin.KinHub.Identity.Api.csproj
  KINRECIPE_API_PROJECT: src/Presentations/Kin.KinHub.KinRecipe.Api/Kin.KinHub.KinRecipe.Api.csproj
  KINLIST_API_PROJECT: src/Presentations/Kin.KinHub.KinList.Api/Kin.KinHub.KinList.Api.csproj
  KINLIST_AUDIO_WORKER_PROJECT: src/Presentations/Kin.KinHub.KinList.AudioWorker/Kin.KinHub.KinList.AudioWorker.csproj
  IDENTITY_DOCKERFILE: src/Presentations/Kin.KinHub.Identity.Api/Dockerfile
  KINRECIPE_DOCKERFILE: src/Presentations/Kin.KinHub.KinRecipe.Api/Dockerfile
  KINLIST_DOCKERFILE: src/Presentations/Kin.KinHub.KinList.Api/Dockerfile
  KINLIST_AUDIO_WORKER_DOCKERFILE: src/Presentations/Kin.KinHub.KinList.AudioWorker/Dockerfile
  MIGRATION_DOCKERFILE: src/Presentations/Kin.KinHub.Migrations.Runner/Dockerfile

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    name: Backend Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard against Model Context Protocol references
        run: bash scripts/verify-no-mcp.sh

      - name: Guard migration and IaC rollout contract
        run: bash scripts/verify-migration-iac.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET solution
        run: dotnet restore ${{ env.DOTNET_SOLUTION }}

      - name: Build .NET solution
        run: dotnet build ${{ env.DOTNET_SOLUTION }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.DOTNET_SOLUTION }} --configuration Release --no-build

  validate_bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file ${{ env.BICEP_FILE }}

  package_identity_image:
    name: Package Identity Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: identity_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-identity-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push Identity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.IDENTITY_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.identity_image.outputs.image }}

  package_kinrecipe_image:
    name: Package KinRecipe Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: kinrecipe_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinrecipe-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push KinRecipe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.KINRECIPE_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.kinrecipe_image.outputs.image }}

  package_kinlist_image:
    name: Package KinList Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: kinlist_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-api:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push KinList image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.KINLIST_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.kinlist_image.outputs.image }}

  package_migration_image:
    name: Package Migration Runner Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: migration_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-migration:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push Migration Runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.MIGRATION_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.migration_image.outputs.image }}

  package_kinlist_audio_worker_image:
    name: Package KinList Audio Worker Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: kinlist_audio_worker_image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.GHCR_SERVER }}/${owner}/kinhub-kinlist-audio-worker:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push KinList audio worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.KINLIST_AUDIO_WORKER_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.kinlist_audio_worker_image.outputs.image }}

  deploy_dev:
    name: Deploy Dev
    if: github.event_name != 'pull_request'
    needs:
      - validate_bicep
      - package_identity_image
      - package_kinrecipe_image
      - package_kinlist_image
      - package_kinlist_audio_worker_image
      - package_migration_image
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: dev
    secrets: inherit

  deploy_prod:
    name: Deploy Prod
    if: github.event_name != 'pull_request'
    needs:
      - deploy_dev
      - package_identity_image
      - package_kinrecipe_image
      - package_kinlist_image
      - package_kinlist_audio_worker_image
      - package_migration_image
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: prod
    secrets: inherit
