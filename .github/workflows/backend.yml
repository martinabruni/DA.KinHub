name: Backend CI CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SOLUTION: Kin.KinHub.Core.slnx
  BICEP_FILE: ops/iac/main.bicep
  GHCR_SERVER: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IDENTITY_API_PROJECT: src/Presentations/Kin.KinHub.Identity.Api/Kin.KinHub.Identity.Api.csproj
  KINRECIPE_API_PROJECT: src/Presentations/Kin.KinHub.KinRecipe.Api/Kin.KinHub.KinRecipe.Api.csproj
  IDENTITY_DOCKERFILE: src/Presentations/Kin.KinHub.Identity.Api/Dockerfile
  KINRECIPE_DOCKERFILE: src/Presentations/Kin.KinHub.KinRecipe.Api/Dockerfile

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    name: Backend Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET solution
        run: dotnet restore ${{ env.DOTNET_SOLUTION }}

      - name: Build .NET solution
        run: dotnet build ${{ env.DOTNET_SOLUTION }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.DOTNET_SOLUTION }} --configuration Release --no-build

  validate_bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file ${{ env.BICEP_FILE }}

  package_identity_image:
    name: Package Identity Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image=${{ env.GHCR_SERVER }}/${{ env.IMAGE_NAMESPACE }}/kinhub-identity-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push Identity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.IDENTITY_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}

  package_kinrecipe_image:
    name: Package KinRecipe Image
    runs-on: ubuntu-latest
    needs:
      - backend_ci
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image=${{ env.GHCR_SERVER }}/${{ env.IMAGE_NAMESPACE }}/kinhub-kinrecipe-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_SERVER }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push KinRecipe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.KINRECIPE_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}

  deploy_dev:
    name: Deploy Dev
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - validate_bicep
      - package_identity_image
      - package_kinrecipe_image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}" \
              coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}" \
              identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}" \
              kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}" \
              containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}" \
              identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
              kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" \
              applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}" \
              logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
              keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
              postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}" \
              postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}" \
              postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
              openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              jwtIssuer="${{ vars.JWT_ISSUER }}" \
              ghcrUsername="${{ secrets.GHCR_USERNAME }}" \
              ghcrPassword="${{ secrets.GHCR_PASSWORD }}" \
              identityImage="${{ needs.package_identity_image.outputs.image }}" \
              kinRecipeImage="${{ needs.package_kinrecipe_image.outputs.image }}"

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}" \
              coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}" \
              identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}" \
              kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}" \
              containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}" \
              identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
              kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" \
              applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}" \
              logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
              keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
              postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}" \
              postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}" \
              postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
              openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              jwtIssuer="${{ vars.JWT_ISSUER }}" \
              ghcrUsername="${{ secrets.GHCR_USERNAME }}" \
              ghcrPassword="${{ secrets.GHCR_PASSWORD }}" \
              identityImage="${{ needs.package_identity_image.outputs.image }}" \
              kinRecipeImage="${{ needs.package_kinrecipe_image.outputs.image }}"

  deploy_prod:
    name: Deploy Prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - deploy_dev
      - package_identity_image
      - package_kinrecipe_image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}" \
              coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}" \
              identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}" \
              kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}" \
              containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}" \
              identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
              kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" \
              applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}" \
              logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
              keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
              postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}" \
              postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}" \
              postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
              openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              jwtIssuer="${{ vars.JWT_ISSUER }}" \
              ghcrUsername="${{ secrets.GHCR_USERNAME }}" \
              ghcrPassword="${{ secrets.GHCR_PASSWORD }}" \
              identityImage="${{ needs.package_identity_image.outputs.image }}" \
              kinRecipeImage="${{ needs.package_kinrecipe_image.outputs.image }}"

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file "${{ env.BICEP_FILE }}" \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              staticWebAppLocation="${{ vars.STATIC_WEB_APP_LOCATION }}" \
              coreStaticWebAppName="${{ vars.CORE_STATIC_WEB_APP_NAME }}" \
              identityStaticWebAppName="${{ vars.IDENTITY_STATIC_WEB_APP_NAME }}" \
              kinRecipeStaticWebAppName="${{ vars.KINRECIPE_STATIC_WEB_APP_NAME }}" \
              containerAppsEnvironmentName="${{ vars.CONTAINER_APPS_ENVIRONMENT_NAME }}" \
              identityContainerAppName="${{ vars.IDENTITY_CONTAINER_APP_NAME }}" \
              kinRecipeContainerAppName="${{ vars.KINRECIPE_CONTAINER_APP_NAME }}" \
              applicationInsightsName="${{ vars.APPLICATION_INSIGHTS_NAME }}" \
              logAnalyticsWorkspaceName="${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}" \
              keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
              postgresServerName="${{ vars.POSTGRES_SERVER_NAME }}" \
              postgresDatabaseName="${{ vars.POSTGRES_DATABASE_NAME }}" \
              postgresAdministratorLogin="${{ secrets.POSTGRES_ADMINISTRATOR_LOGIN }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
              openAiAccountName="${{ vars.OPEN_AI_ACCOUNT_NAME }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              jwtIssuer="${{ vars.JWT_ISSUER }}" \
              ghcrUsername="${{ secrets.GHCR_USERNAME }}" \
              ghcrPassword="${{ secrets.GHCR_PASSWORD }}" \
              identityImage="${{ needs.package_identity_image.outputs.image }}" \
              kinRecipeImage="${{ needs.package_kinrecipe_image.outputs.image }}"
