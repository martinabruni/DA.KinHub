name: Deploy application code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BUILD_ENVIRONMENT: Development
  POSTGRES_RUNTIME_USERNAME: kinhub_app
  POSTGRES_MIGRATION_USERNAME: kinhub_migrator

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build, test and validate
        run: |
          dotnet restore KinHub.slnx
          dotnet build KinHub.slnx --configuration Release --no-restore
          dotnet test KinHub.slnx --configuration Release --no-build
          npm ci --prefix src/frontend
          npm run --prefix src/frontend test
          npm run --prefix src/frontend lint
          npm run --prefix src/frontend typecheck
          npm run skills:validate
          npm run docs:validate
          npm run release:validate
          npm run --prefix src/frontend i18n:validate
          npm run --prefix src/frontend routes:validate

      - name: Build migration bundle
        run: |
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations bundle --project src/backend/infrastructure/DA.KinHub.Infrastructure --startup-project src/backend/applications/DA.KinHub.Functions --configuration Release --self-contained false --force --output artifacts/migrations/kinhub-migrations

      - name: Package backend
        id: package
        shell: bash
        run: |
          bash scripts/package-backend.sh "$BUILD_ENVIRONMENT"
          package=$(find artifacts/backend -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve PostgreSQL deployment settings
        id: postgres
        shell: bash
        run: |
          app_settings=$(az functionapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --output json)
          echo "host=$(jq -r '.[] | select(.name == \"Database__Host\") | .value' <<< \"$app_settings\")" >> "$GITHUB_OUTPUT"
          echo "database=$(jq -r '.[] | select(.name == \"Database__DatabaseName\") | .value' <<< \"$app_settings\")" >> "$GITHUB_OUTPUT"
          echo "server_name=$(jq -r '.[] | select(.name == \"Database__Host\") | .value' <<< \"$app_settings\" | cut -d'.' -f1)" >> "$GITHUB_OUTPUT"
          echo "function_principal_id=$(az functionapp identity show --resource-group \"${{ vars.AZURE_RESOURCE_GROUP }}\" --name \"${{ vars.AZURE_FUNCTIONAPP_NAME }}\" --query principalId --output tsv)" >> "$GITHUB_OUTPUT"
          principal=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query '{displayName:displayName,id:id}' --output json)
          echo "admin_name=$(jq -r '.displayName' <<< \"$principal\")" >> "$GITHUB_OUTPUT"
          echo "admin_object_id=$(jq -r '.id' <<< \"$principal\")" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Open temporary PostgreSQL firewall rule
        id: postgres_firewall
        shell: bash
        run: |
          runner_ip=$(curl --silent https://ifconfig.me)
          rule_name="gha-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.postgres.outputs.server_name }}" \
            --rule-name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --only-show-errors --output none
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Provision database principals
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.postgres.outputs.host }}" \
            --dbname postgres \
            --username "${{ steps.postgres.outputs.admin_name }}" \
            --set ON_ERROR_STOP=1 <<SQL
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_RUNTIME_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_RUNTIME_USERNAME }}', '${{ steps.postgres.outputs.function_principal_id }}', 'service', false, false);
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_MIGRATION_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_MIGRATION_USERNAME }}', '${{ steps.postgres.outputs.admin_object_id }}', 'service', true, false);
            END IF;
          END
          $$;
          SQL

      - name: Apply database migrations
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          artifacts/migrations/kinhub-migrations --connection "Host=${{ steps.postgres.outputs.host }};Port=5432;Database=${{ steps.postgres.outputs.database }};Username=${{ env.POSTGRES_MIGRATION_USERNAME }};Password=${token};SSL Mode=Require;Trust Server Certificate=false"

      - name: Grant runtime database privileges
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.postgres.outputs.host }}" \
            --dbname "${{ steps.postgres.outputs.database }}" \
            --username "${{ env.POSTGRES_MIGRATION_USERNAME }}" \
            --set ON_ERROR_STOP=1 <<SQL
          GRANT CONNECT ON DATABASE "${{ steps.postgres.outputs.database }}" TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE ON SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          SQL

      - name: Close temporary PostgreSQL firewall rule
        if: always() && steps.postgres_firewall.outputs.rule_name != ''
        shell: bash
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.postgres.outputs.server_name }}" \
            --rule-name "${{ steps.postgres_firewall.outputs.rule_name }}" \
            --yes --only-show-errors

      - name: Deploy Function App with One Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ steps.package.outputs.path }}
          sku: flexconsumption
          remote-build: false

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_FRONTEND_CLIENT_ID: ${{ secrets.ENTRA_FRONTEND_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY || format('https://login.microsoftonline.com/{0}', secrets.AZURE_TENANT_ID) }}
          VITE_ENTRA_REDIRECT_URI: ${{ vars.AZURE_STATIC_WEB_APP_URL }}
        run: npm run --prefix src/frontend build

      - name: Deploy Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend/dist
          skip_app_build: true
          output_location: ""

      - name: Smoke test API
        run: |
          curl --fail --retry 8 --retry-delay 10 "https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/health/live"
          curl --fail --retry 8 --retry-delay 10 "https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/version"

      - uses: actions/upload-artifact@v7
        with:
          name: kinhub-backend-${{ github.sha }}
          path: |
            artifacts/backend/*.zip
            artifacts/backend/*.sha256
            artifacts/backend/build-manifest.json

      - name: Deployment summary
        run: |
          echo "## KinHub code deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function App: ${{ vars.AZURE_FUNCTIONAPP_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $(basename '${{ steps.package.outputs.path }}')" >> "$GITHUB_STEP_SUMMARY"
