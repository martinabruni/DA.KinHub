name: Deploy application

on:
  workflow_call:
    inputs:
      function_app_name:
        required: false
        type: string
      function_app_hostname:
        required: false
        type: string
      static_web_app_hostname:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  BUILD_ENVIRONMENT: Development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Reject out-of-order reruns
        if: github.run_attempt != 1
        run: |
          echo "Start a new deploy.yml workflow_dispatch run instead of rerunning an old deployment." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build, test and validate
        run: |
          dotnet restore KinHub.slnx
          dotnet build KinHub.slnx --configuration Release --no-restore
          dotnet test KinHub.slnx --configuration Release --no-build
          npm ci --prefix src/frontend
          npm run --prefix src/frontend test
          npm run --prefix src/frontend lint
          npm run --prefix src/frontend typecheck
          npm run skills:validate
          npm run docs:validate
          npm run release:validate
          npm run --prefix src/frontend i18n:validate
          npm run --prefix src/frontend routes:validate
          npm run --prefix src/frontend design-system:validate

      - name: Package backend
        id: package
        shell: bash
        run: |
          bash scripts/package-backend.sh "$BUILD_ENVIRONMENT"
          package=$(find artifacts/backend -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment settings
        id: deploy
        shell: bash
        run: |
          function_app_name="${{ inputs.function_app_name || vars.AZURE_FUNCTIONAPP_NAME }}"
          function_app_hostname="${{ inputs.function_app_hostname }}"
          static_web_app_hostname="${{ inputs.static_web_app_hostname }}"
          static_web_app_name="${{ vars.AZURE_STATIC_WEB_APP_NAME }}"

          if [[ -z "$function_app_name" ]]; then
            function_app_name=$(az functionapp list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[0].name" \
              --output tsv)
          fi
          if [[ -z "$function_app_hostname" ]]; then
            function_app_hostname="${function_app_name}.azurewebsites.net"
          fi
          if [[ -z "$static_web_app_hostname" ]]; then
            if [[ -n "$static_web_app_name" ]]; then
              static_web_app_hostname=$(az staticwebapp show \
                --name "$static_web_app_name" \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --query defaultHostname \
                --output tsv)
            else
              static_web_app_hostname=$(az staticwebapp list \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --query "[0].defaultHostname" \
                --output tsv)
            fi
          fi

          test -n "$function_app_name"
          test -n "$function_app_hostname"
          test -n "$static_web_app_hostname"
          echo "function_app_name=$function_app_name" >> "$GITHUB_OUTPUT"
          echo "function_app_hostname=$function_app_hostname" >> "$GITHUB_OUTPUT"
          echo "static_web_app_hostname=$static_web_app_hostname" >> "$GITHUB_OUTPUT"

      - name: Deploy Function App with One Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.deploy.outputs.function_app_name }}
          package: ${{ steps.package.outputs.path }}
          sku: flexconsumption
          remote-build: false

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://${{ steps.deploy.outputs.function_app_hostname }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          VITE_ENTRA_FRONTEND_CLIENT_ID: ${{ secrets.ENTRA_FRONTEND_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_INSTANCE }}
          VITE_ENTRA_REDIRECT_URI: https://${{ steps.deploy.outputs.static_web_app_hostname }}
        run: npm run --prefix src/frontend build

      - name: Deploy Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.CORE_AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend/dist
          skip_app_build: true
          output_location: ""

      - name: Smoke test API
        run: |
          curl --fail --retry 8 --retry-delay 10 "https://${{ steps.deploy.outputs.function_app_hostname }}/health/live"
          curl --fail --retry 8 --retry-delay 10 "https://${{ steps.deploy.outputs.function_app_hostname }}/api/version"

      - uses: actions/upload-artifact@v7
        with:
          name: kinhub-backend-${{ github.sha }}
          path: |
            artifacts/backend/*.zip
            artifacts/backend/*.sha256
            artifacts/backend/build-manifest.json

      - name: Deployment summary
        run: |
          echo "## KinHub code deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function App: ${{ steps.deploy.outputs.function_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $(basename '${{ steps.package.outputs.path }}')" >> "$GITHUB_STEP_SUMMARY"
