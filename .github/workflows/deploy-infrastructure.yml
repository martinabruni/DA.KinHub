name: Deploy complete infrastructure

on:
  push:
    tags:
      - "infra-*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BUILD_ENVIRONMENT: Development
  POSTGRES_RUNTIME_USERNAME: kinhub_app
  POSTGRES_MIGRATION_USERNAME: kinhub_migrator

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve PostgreSQL Entra administrator
        id: postgres_admin
        shell: bash
        run: |
          principal_name=$(az account show --query user.name --output tsv)
          access_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          principal_object_id=$(node -e "const token=process.argv[1].split('.')[1]; const normalized=token.replace(/-/g,'+').replace(/_/g,'/'); const padded=normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, '='); const payload=JSON.parse(Buffer.from(padded, 'base64').toString('utf8')); process.stdout.write(payload.oid ?? '');" "$access_token")

          test -n "$principal_name"
          test -n "$principal_object_id"

          echo "name=$principal_name" >> "$GITHUB_OUTPUT"
          echo "object_id=$principal_object_id" >> "$GITHUB_OUTPUT"

      - name: Validate infrastructure
        shell: bash
        run: |
          az bicep install
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app.bicep \
            --parameters infra/main.dev.bicepparam \
             --parameters postgresAdminUsername="${{ secrets.POSTGRES_ADMIN_USERNAME || secrets.POSTGRES_ADMINISTRATOR_LOGIN }}" \
                           postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD || secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
                           entraTenantId="${{ secrets.AZURE_TENANT_ID }}" \
                           entraBackendAudience="${{ secrets.ENTRA_BACKEND_AUDIENCE }}" \
                           entraApiScope="${{ secrets.ENTRA_API_SCOPE }}" \
                          postgresEntraAdministratorName="${{ steps.postgres_admin.outputs.name }}" \
                          postgresEntraAdministratorObjectId="${{ steps.postgres_admin.outputs.object_id }}" \
                          postgresEntraAdministratorPrincipalType="ServicePrincipal" \
             --only-show-errors --output none

      - name: Deploy infrastructure
        id: infra
        shell: bash
        run: |
          outputs=$(az deployment group create \
            --name "kinhub-${GITHUB_RUN_ID}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app.bicep \
            --parameters infra/main.dev.bicepparam \
             --parameters postgresAdminUsername="${{ secrets.POSTGRES_ADMIN_USERNAME || secrets.POSTGRES_ADMINISTRATOR_LOGIN }}" \
                           postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD || secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
                           entraTenantId="${{ secrets.AZURE_TENANT_ID }}" \
                           entraBackendAudience="${{ secrets.ENTRA_BACKEND_AUDIENCE }}" \
                           entraApiScope="${{ secrets.ENTRA_API_SCOPE }}" \
                          postgresEntraAdministratorName="${{ steps.postgres_admin.outputs.name }}" \
                          postgresEntraAdministratorObjectId="${{ steps.postgres_admin.outputs.object_id }}" \
                          postgresEntraAdministratorPrincipalType="ServicePrincipal" \
             --query properties.outputs --only-show-errors --output json)
          echo "function_app_name=$(jq -r '.functionAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "function_hostname=$(jq -r '.functionAppHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "function_principal_id=$(jq -r '.functionAppPrincipalId.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(jq -r '.staticWebAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "static_web_app_hostname=$(jq -r '.staticWebAppHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_server_name=$(jq -r '.postgresServerName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_fqdn=$(jq -r '.postgresServerFqdn.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_db_name=$(jq -r '.postgresDatabaseName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Build and test backend
        run: |
          dotnet restore KinHub.slnx
          dotnet build KinHub.slnx --configuration Release --no-restore
          dotnet test KinHub.slnx --configuration Release --no-build

      - name: Build migration bundle
        run: |
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations bundle --project src/backend/infrastructure/DA.KinHub.Infrastructure --startup-project src/backend/applications/DA.KinHub.Functions --configuration Release --force --output artifacts/migrations/kinhub-migrations

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Open temporary PostgreSQL firewall rule
        id: postgres_firewall
        shell: bash
        run: |
          runner_ip=$(curl --silent https://ifconfig.me)
          rule_name="gha-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infra.outputs.postgres_server_name }}" \
            --rule-name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --only-show-errors --output none
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Provision database principals
        shell: bash
        env:
          POSTGRES_ADMIN_USERNAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.infra.outputs.postgres_fqdn }}" \
            --dbname postgres \
            --username "$POSTGRES_ADMIN_USERNAME" \
            --set ON_ERROR_STOP=1 <<SQL
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_RUNTIME_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_RUNTIME_USERNAME }}', '${{ steps.infra.outputs.function_principal_id }}', 'service', false, false);
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_MIGRATION_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_MIGRATION_USERNAME }}', '$POSTGRES_ADMIN_OBJECT_ID', 'service', true, false);
            END IF;
          END
          $$;
          SQL

      - name: Apply database migrations
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          artifacts/migrations/kinhub-migrations --connection "Host=${{ steps.infra.outputs.postgres_fqdn }};Port=5432;Database=${{ steps.infra.outputs.postgres_db_name }};Username=${{ env.POSTGRES_MIGRATION_USERNAME }};Password=${token};SSL Mode=Require;Trust Server Certificate=false"

      - name: Grant runtime database privileges
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.infra.outputs.postgres_fqdn }}" \
            --dbname "${{ steps.infra.outputs.postgres_db_name }}" \
            --username "${{ env.POSTGRES_MIGRATION_USERNAME }}" \
            --set ON_ERROR_STOP=1 <<SQL
          GRANT CONNECT ON DATABASE "${{ steps.infra.outputs.postgres_db_name }}" TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE ON SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          SQL

      - name: Close temporary PostgreSQL firewall rule
        if: always() && steps.postgres_firewall.outputs.rule_name != ''
        shell: bash
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infra.outputs.postgres_server_name }}" \
            --rule-name "${{ steps.postgres_firewall.outputs.rule_name }}" \
            --yes --only-show-errors

      - name: Package backend
        id: package
        shell: bash
        run: |
          bash scripts/package-backend.sh "$BUILD_ENVIRONMENT"
          package=$(find artifacts/backend -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Deploy Function App with One Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_app_name }}
          package: ${{ steps.package.outputs.path }}
          sku: flexconsumption
          remote-build: false

      - name: Install and validate frontend
        run: |
          npm ci --prefix src/frontend
          npm run --prefix src/frontend test
          npm run --prefix src/frontend lint
          npm run --prefix src/frontend typecheck
          npm run skills:validate
          npm run docs:validate
          npm run release:validate
          npm run --prefix src/frontend i18n:validate
          npm run --prefix src/frontend routes:validate

      - name: Build frontend and release metadata
        env:
          VITE_API_BASE_URL: https://${{ steps.infra.outputs.function_hostname }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_FRONTEND_CLIENT_ID: ${{ secrets.ENTRA_FRONTEND_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY || format('https://login.microsoftonline.com/{0}', secrets.AZURE_TENANT_ID) }}
          VITE_ENTRA_REDIRECT_URI: https://${{ steps.infra.outputs.static_web_app_hostname }}
        run: npm run --prefix src/frontend build

      - name: Deploy Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.CORE_AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend/dist
          skip_app_build: true
          output_location: ""

      - name: Smoke test API
        shell: bash
        run: |
          curl --fail --retry 8 --retry-delay 10 "https://${{ steps.infra.outputs.function_hostname }}/health/live"
          curl --fail --retry 8 --retry-delay 10 "https://${{ steps.infra.outputs.function_hostname }}/api/version"

      - uses: actions/upload-artifact@v7
        with:
          name: kinhub-backend-${{ github.ref_name }}
          path: |
            artifacts/backend/*.zip
            artifacts/backend/*.sha256
            artifacts/backend/build-manifest.json

      - name: Deployment summary
        run: |
          echo "## KinHub infrastructure deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function App: ${{ steps.infra.outputs.function_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static Web App: ${{ steps.infra.outputs.static_web_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend artifact: $(basename '${{ steps.package.outputs.path }}')" >> "$GITHUB_STEP_SUMMARY"
