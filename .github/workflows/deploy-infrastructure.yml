name: Deploy infrastructure and database

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  POSTGRES_RUNTIME_USERNAME: kinhub_app
  POSTGRES_MIGRATION_USERNAME: kinhub_migrator

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      function_app_name: ${{ steps.infra.outputs.function_app_name }}
      function_hostname: ${{ steps.infra.outputs.function_hostname }}
      static_web_app_hostname: ${{ steps.infra.outputs.static_web_app_hostname }}
    steps:
      - name: Reject out-of-order reruns
        if: github.run_attempt != 1
        run: |
          echo "Start a new deploy.yml workflow_dispatch run instead of rerunning an old deployment." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve PostgreSQL Entra administrator
        id: postgres_admin
        shell: bash
        run: |
          principal_name=$(az account show --query user.name --output tsv)
          access_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          principal_object_id=$(node -e "const token=process.argv[1].split('.')[1]; const normalized=token.replace(/-/g,'+').replace(/_/g,'/'); const padded=normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, '='); const payload=JSON.parse(Buffer.from(padded, 'base64').toString('utf8')); process.stdout.write(payload.oid ?? '');" "$access_token")

          test -n "$principal_name"
          test -n "$principal_object_id"

          echo "name=$principal_name" >> "$GITHUB_OUTPUT"
          echo "object_id=$principal_object_id" >> "$GITHUB_OUTPUT"

      - name: Validate infrastructure
        id: infrastructure_parameters
        shell: bash
        env:
          AZURE_TENANT_ID_INPUT: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_BACKEND_AUDIENCE_INPUT: ${{ secrets.ENTRA_BACKEND_AUDIENCE }}
          ENTRA_INSTANCE_INPUT: ${{ vars.ENTRA_INSTANCE }}
          ENTRA_TENANT_ID_INPUT: ${{ secrets.ENTRA_TENANT_ID }}
          POSTGRES_ADMIN_PASSWORD_INPUT: ${{ secrets.POSTGRES_ADMIN_PASSWORD || secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}
          POSTGRES_ADMIN_USERNAME_INPUT: ${{ secrets.POSTGRES_ADMIN_USERNAME || secrets.POSTGRES_ADMINISTRATOR_LOGIN }}
          POSTGRES_ENTRA_ADMIN_NAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ENTRA_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          az bicep install
          parameters_file="$RUNNER_TEMP/kinhub-dev.parameters.json"
          az bicep build-params \
            --file infra/main.dev.bicepparam \
            --outfile "$parameters_file"
          echo "path=$parameters_file" >> "$GITHUB_OUTPUT"
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app.bicep \
            --parameters "@${parameters_file}" \
                         postgresAdminUsername="$POSTGRES_ADMIN_USERNAME_INPUT" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD_INPUT" \
                         azureTenantId="$AZURE_TENANT_ID_INPUT" \
                         entraInstance="$ENTRA_INSTANCE_INPUT" \
                         entraTenantId="$ENTRA_TENANT_ID_INPUT" \
                         entraBackendAudience="$ENTRA_BACKEND_AUDIENCE_INPUT" \
                         postgresEntraAdministratorName="$POSTGRES_ENTRA_ADMIN_NAME" \
                         postgresEntraAdministratorObjectId="$POSTGRES_ENTRA_ADMIN_OBJECT_ID" \
                         postgresEntraAdministratorPrincipalType="ServicePrincipal" \
             --only-show-errors --output none

      - name: Deploy infrastructure
        id: infra
        shell: bash
        env:
          AZURE_TENANT_ID_INPUT: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_BACKEND_AUDIENCE_INPUT: ${{ secrets.ENTRA_BACKEND_AUDIENCE }}
          ENTRA_INSTANCE_INPUT: ${{ vars.ENTRA_INSTANCE }}
          ENTRA_TENANT_ID_INPUT: ${{ secrets.ENTRA_TENANT_ID }}
          POSTGRES_ADMIN_PASSWORD_INPUT: ${{ secrets.POSTGRES_ADMIN_PASSWORD || secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}
          POSTGRES_ADMIN_USERNAME_INPUT: ${{ secrets.POSTGRES_ADMIN_USERNAME || secrets.POSTGRES_ADMINISTRATOR_LOGIN }}
          POSTGRES_ENTRA_ADMIN_NAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ENTRA_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          outputs=$(az deployment group create \
            --name "kinhub-${GITHUB_RUN_ID}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app.bicep \
            --parameters "@${{ steps.infrastructure_parameters.outputs.path }}" \
                         postgresAdminUsername="$POSTGRES_ADMIN_USERNAME_INPUT" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD_INPUT" \
                         azureTenantId="$AZURE_TENANT_ID_INPUT" \
                         entraInstance="$ENTRA_INSTANCE_INPUT" \
                         entraTenantId="$ENTRA_TENANT_ID_INPUT" \
                         entraBackendAudience="$ENTRA_BACKEND_AUDIENCE_INPUT" \
                         postgresEntraAdministratorName="$POSTGRES_ENTRA_ADMIN_NAME" \
                         postgresEntraAdministratorObjectId="$POSTGRES_ENTRA_ADMIN_OBJECT_ID" \
                         postgresEntraAdministratorPrincipalType="ServicePrincipal" \
             --query properties.outputs --only-show-errors --output json)
          echo "function_app_name=$(jq -r '.functionAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "function_hostname=$(jq -r '.functionAppHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "function_principal_id=$(jq -r '.functionAppPrincipalId.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(jq -r '.staticWebAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "static_web_app_hostname=$(jq -r '.staticWebAppHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_server_name=$(jq -r '.postgresServerName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_fqdn=$(jq -r '.postgresServerFqdn.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_db_name=$(jq -r '.postgresDatabaseName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Build and test backend
        run: |
          dotnet restore KinHub.slnx
          dotnet build KinHub.slnx --configuration Release --no-restore
          dotnet test KinHub.slnx --configuration Release --no-build

      - name: Build migration bundle
        run: |
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations bundle --project src/backend/infrastructure/DA.KinHub.Infrastructure --configuration Release --force --output artifacts/migrations/kinhub-migrations

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Open temporary PostgreSQL firewall rule
        id: postgres_firewall
        shell: bash
        run: |
          subscription_id=$(az account show --query id --output tsv)
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)
          rule_name="gha-${GITHUB_RUN_ID}"
          rule_url="https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ steps.infra.outputs.postgres_server_name }}/firewallRules/${rule_name}?api-version=2024-08-01"
          az rest \
            --method put \
            --url "$rule_url" \
            --body "{\"properties\":{\"startIpAddress\":\"${runner_ip}\",\"endIpAddress\":\"${runner_ip}\"}}" \
            --only-show-errors \
            --output none
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Provision database principals
        shell: bash
        env:
          POSTGRES_ADMIN_USERNAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.infra.outputs.postgres_fqdn }}" \
            --dbname postgres \
            --username "$POSTGRES_ADMIN_USERNAME" \
            --set ON_ERROR_STOP=1 <<SQL
          DO \$kinhub\$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_RUNTIME_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_RUNTIME_USERNAME }}', '${{ steps.infra.outputs.function_principal_id }}', 'service', false, false);
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${{ env.POSTGRES_MIGRATION_USERNAME }}') THEN
              PERFORM * FROM pg_catalog.pgaadauth_create_principal_with_oid('${{ env.POSTGRES_MIGRATION_USERNAME }}', '$POSTGRES_ADMIN_OBJECT_ID', 'service', true, false);
            END IF;
          END
          \$kinhub\$;
          SQL

      - name: Apply database migrations
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          artifacts/migrations/kinhub-migrations --connection "Host=${{ steps.infra.outputs.postgres_fqdn }};Port=5432;Database=${{ steps.infra.outputs.postgres_db_name }};Username=${{ env.POSTGRES_MIGRATION_USERNAME }};Password=${token};SSL Mode=Require;Trust Server Certificate=false"

      - name: Grant runtime database privileges
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          export PGPASSWORD="$token"
          psql \
            --host "${{ steps.infra.outputs.postgres_fqdn }}" \
            --dbname "${{ steps.infra.outputs.postgres_db_name }}" \
            --username "${{ env.POSTGRES_MIGRATION_USERNAME }}" \
            --set ON_ERROR_STOP=1 <<SQL
          GRANT CONNECT ON DATABASE "${{ steps.infra.outputs.postgres_db_name }}" TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE ON SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA shared TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE ON SCHEMA kinlist TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA kinlist TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA kinlist TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA shared
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA kinlist
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          ALTER DEFAULT PRIVILEGES FOR ROLE "${{ env.POSTGRES_MIGRATION_USERNAME }}" IN SCHEMA kinlist
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "${{ env.POSTGRES_RUNTIME_USERNAME }}";
          SQL

      - name: Close temporary PostgreSQL firewall rule
        if: always() && steps.postgres_firewall.outputs.rule_name != ''
        shell: bash
        run: |
          subscription_id=$(az account show --query id --output tsv)
          rule_url="https://management.azure.com/subscriptions/${subscription_id}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ steps.infra.outputs.postgres_server_name }}/firewallRules/${{ steps.postgres_firewall.outputs.rule_name }}?api-version=2024-08-01"
          az rest \
            --method delete \
            --url "$rule_url" \
            --only-show-errors \
            --output none

      - name: Deployment summary
        run: |
          echo "## KinHub infrastructure and database deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function App: ${{ steps.infra.outputs.function_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static Web App: ${{ steps.infra.outputs.static_web_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migrations: applied before application deployment" >> "$GITHUB_STEP_SUMMARY"

  deploy-application:
    name: Deploy application after infrastructure
    needs: deploy
    uses: ./.github/workflows/deploy-code.yml
    with:
      function_app_name: ${{ needs.deploy.outputs.function_app_name }}
      function_app_hostname: ${{ needs.deploy.outputs.function_hostname }}
      static_web_app_hostname: ${{ needs.deploy.outputs.static_web_app_hostname }}
    secrets: inherit
