name: Provision Azure infrastructure

on:
  workflow_call:
    outputs:
      function_app_name:
        description: Provisioned Function App name
        value: ${{ jobs.deploy.outputs.function_app_name }}
      function_app_hostname:
        description: Provisioned Function App hostname
        value: ${{ jobs.deploy.outputs.function_app_hostname }}
      function_principal_id:
        description: Function App managed identity object id
        value: ${{ jobs.deploy.outputs.function_principal_id }}
      static_web_app_name:
        description: Provisioned Static Web App name
        value: ${{ jobs.deploy.outputs.static_web_app_name }}
      static_web_app_hostname:
        description: Provisioned Static Web App hostname
        value: ${{ jobs.deploy.outputs.static_web_app_hostname }}
      postgres_server_name:
        description: Provisioned PostgreSQL server name
        value: ${{ jobs.deploy.outputs.postgres_server_name }}
      postgres_hostname:
        description: Provisioned PostgreSQL hostname
        value: ${{ jobs.deploy.outputs.postgres_hostname }}
      postgres_database_name:
        description: Provisioned PostgreSQL database name
        value: ${{ jobs.deploy.outputs.postgres_database_name }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      function_app_name: ${{ steps.infra.outputs.function_app_name }}
      function_app_hostname: ${{ steps.infra.outputs.function_app_hostname }}
      function_principal_id: ${{ steps.infra.outputs.function_principal_id }}
      static_web_app_name: ${{ steps.infra.outputs.static_web_app_name }}
      static_web_app_hostname: ${{ steps.infra.outputs.static_web_app_hostname }}
      postgres_server_name: ${{ steps.infra.outputs.postgres_server_name }}
      postgres_hostname: ${{ steps.infra.outputs.postgres_hostname }}
      postgres_database_name: ${{ steps.infra.outputs.postgres_database_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve PostgreSQL Entra administrator
        id: postgres_admin
        shell: bash
        run: |
          principal_name=$(az account show --query user.name --output tsv)
          access_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          principal_object_id=$(node -e "const token=process.argv[1].split('.')[1]; const normalized=token.replace(/-/g,'+').replace(/_/g,'/'); const padded=normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, '='); const payload=JSON.parse(Buffer.from(padded, 'base64').toString('utf8')); process.stdout.write(payload.oid ?? '');" "$access_token")

          test -n "$principal_name"
          test -n "$principal_object_id"

          echo "name=$principal_name" >> "$GITHUB_OUTPUT"
          echo "object_id=$principal_object_id" >> "$GITHUB_OUTPUT"

      - name: Validate infrastructure
        id: infrastructure_parameters
        shell: bash
        env:
          AZURE_TENANT_ID_INPUT: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_BACKEND_AUDIENCE_INPUT: ${{ secrets.ENTRA_BACKEND_AUDIENCE }}
          ENTRA_INSTANCE_INPUT: ${{ vars.ENTRA_INSTANCE }}
          ENTRA_TENANT_ID_INPUT: ${{ secrets.ENTRA_TENANT_ID }}
          POSTGRES_ADMIN_PASSWORD_INPUT: ${{ secrets.POSTGRES_ADMIN_PASSWORD || secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}
          POSTGRES_ADMIN_USERNAME_INPUT: ${{ secrets.POSTGRES_ADMIN_USERNAME || secrets.POSTGRES_ADMINISTRATOR_LOGIN }}
          POSTGRES_ENTRA_ADMIN_NAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ENTRA_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          az bicep install
          parameters_file="$RUNNER_TEMP/kinhub-dev.parameters.json"
          az bicep build-params \
            --file infra/main.dev.bicepparam \
            --outfile "$parameters_file"
          echo "path=$parameters_file" >> "$GITHUB_OUTPUT"
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app.bicep \
            --parameters "@${parameters_file}" \
                         postgresAdminUsername="$POSTGRES_ADMIN_USERNAME_INPUT" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD_INPUT" \
                         azureTenantId="$AZURE_TENANT_ID_INPUT" \
                         entraInstance="$ENTRA_INSTANCE_INPUT" \
                         entraTenantId="$ENTRA_TENANT_ID_INPUT" \
                         entraBackendAudience="$ENTRA_BACKEND_AUDIENCE_INPUT" \
                         postgresEntraAdministratorName="$POSTGRES_ENTRA_ADMIN_NAME" \
                         postgresEntraAdministratorObjectId="$POSTGRES_ENTRA_ADMIN_OBJECT_ID" \
                         postgresEntraAdministratorPrincipalType="ServicePrincipal" \
            --only-show-errors --output none

      - name: Deploy infrastructure
        id: infra
        shell: bash
        env:
          AZURE_TENANT_ID_INPUT: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_BACKEND_AUDIENCE_INPUT: ${{ secrets.ENTRA_BACKEND_AUDIENCE }}
          ENTRA_INSTANCE_INPUT: ${{ vars.ENTRA_INSTANCE }}
          ENTRA_TENANT_ID_INPUT: ${{ secrets.ENTRA_TENANT_ID }}
          POSTGRES_ADMIN_PASSWORD_INPUT: ${{ secrets.POSTGRES_ADMIN_PASSWORD || secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}
          POSTGRES_ADMIN_USERNAME_INPUT: ${{ secrets.POSTGRES_ADMIN_USERNAME || secrets.POSTGRES_ADMINISTRATOR_LOGIN }}
          POSTGRES_ENTRA_ADMIN_NAME: ${{ steps.postgres_admin.outputs.name }}
          POSTGRES_ENTRA_ADMIN_OBJECT_ID: ${{ steps.postgres_admin.outputs.object_id }}
        run: |
          outputs=$(az deployment group create \
            --name "kinhub-${GITHUB_RUN_ID}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app.bicep \
            --parameters "@${{ steps.infrastructure_parameters.outputs.path }}" \
                         postgresAdminUsername="$POSTGRES_ADMIN_USERNAME_INPUT" \
                         postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD_INPUT" \
                         azureTenantId="$AZURE_TENANT_ID_INPUT" \
                         entraInstance="$ENTRA_INSTANCE_INPUT" \
                         entraTenantId="$ENTRA_TENANT_ID_INPUT" \
                         entraBackendAudience="$ENTRA_BACKEND_AUDIENCE_INPUT" \
                         postgresEntraAdministratorName="$POSTGRES_ENTRA_ADMIN_NAME" \
                         postgresEntraAdministratorObjectId="$POSTGRES_ENTRA_ADMIN_OBJECT_ID" \
                         postgresEntraAdministratorPrincipalType="ServicePrincipal" \
            --query properties.outputs --only-show-errors --output json)
          echo "function_app_name=$(jq -r '.functionAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "function_app_hostname=$(jq -r '.functionAppHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "function_principal_id=$(jq -r '.functionAppPrincipalId.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(jq -r '.staticWebAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "static_web_app_hostname=$(jq -r '.staticWebAppHostname.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_server_name=$(jq -r '.postgresServerName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_hostname=$(jq -r '.postgresServerFqdn.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_database_name=$(jq -r '.postgresDatabaseName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "## KinHub infrastructure provisioning" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function App: ${{ steps.infra.outputs.function_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static Web App: ${{ steps.infra.outputs.static_web_app_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL server: ${{ steps.infra.outputs.postgres_server_name }}" >> "$GITHUB_STEP_SUMMARY"
