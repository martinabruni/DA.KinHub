<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker UI</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar panel" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <div class="brand-mark">TK</div>
          <div class="brand-copy">
            <p class="eyebrow">tracker workspace</p>
            <h1>Tracker Hub</h1>
          </div>
        </div>
        <button type="button" class="icon-button" id="sidebar-toggle" aria-label="Collapse sidebar">
          <span aria-hidden="true">⟨</span>
        </button>
      </div>

      <p class="sidebar-note">Read-only view over the local tracker database.</p>

      <nav class="nav-list" id="nav-list" aria-label="Primary">
        <button type="button" class="nav-item active" data-view="work-items">Work items</button>
        <button type="button" class="nav-item" data-view="board">Board</button>
      </nav>

      <div class="sidebar-foot">
        <span class="label">Local database</span>
        <code id="db-path">loading...</code>
      </div>
    </aside>

    <main class="content">
      <header class="topbar panel">
        <div>
          <p class="eyebrow">tracker hub</p>
          <h2 id="view-title">Work items</h2>
          <p class="subtitle" id="view-description">Table and kanban views over the current backlog.</p>
        </div>
        <div class="topbar-meta">
          <div class="topbar-stats" id="topbar-stats"></div>
        </div>
      </header>

      <section id="work-items-view" class="view-panel panel">
        <div class="section-header">
          <div>
            <p class="eyebrow">Work items</p>
            <h3>Filtered table</h3>
          </div>
          <span class="pill" id="work-items-count">0</span>
        </div>

        <div class="table-shell">
          <table class="work-item-table">
            <thead>
              <tr>
                <th>Id</th>
                <th>Tipologia</th>
                <th>Titolo</th>
                <th>Stato</th>
              </tr>
              <tr class="filter-row">
                <th><input id="filter-id" type="search" placeholder="Filter id"></th>
                <th>
                  <select id="filter-type">
                    <option value="">All</option>
                    <option value="task">task</option>
                    <option value="bug">bug</option>
                    <option value="change-request">change-request</option>
                    <option value="research">research</option>
                  </select>
                </th>
                <th><input id="filter-title" type="search" placeholder="Filter title"></th>
                <th>
                  <select id="filter-status">
                    <option value="">All</option>
                    <option value="backlog">backlog</option>
                    <option value="planned">planned</option>
                    <option value="in-progress">in-progress</option>
                    <option value="blocked">blocked</option>
                    <option value="implemented">implemented</option>
                    <option value="validated">validated</option>
                    <option value="archived">archived</option>
                  </select>
                </th>
              </tr>
            </thead>
            <tbody id="work-items-body"></tbody>
          </table>
          <div id="work-items-empty" class="empty-state hidden"></div>
        </div>
      </section>

      <section id="board-view" class="view-panel panel hidden">
        <div class="section-header">
          <div>
            <p class="eyebrow">Board</p>
            <h3>Kanban</h3>
          </div>
          <span class="pill muted">horizontal</span>
        </div>
        <div id="board-columns" class="board-track"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="detail-modal" role="presentation">
    <section class="modal panel" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
      <header class="modal-head">
        <div>
          <p class="eyebrow">Work item detail</p>
          <h2 id="detail-modal-title">Loading...</h2>
        </div>
        <button type="button" class="icon-button" id="detail-modal-close" aria-label="Close detail dialog">×</button>
      </header>
      <div id="detail-modal-body" class="modal-body"></div>
    </section>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
